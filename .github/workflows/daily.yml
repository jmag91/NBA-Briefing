name: Daily NBA briefing

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 8:00 AM PDT / 7:00 AM PST
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update briefing"
          git push
