name: NBA briefing

on:
  schedule:
    - cron: "0 * * * *"   # every hour (UTC); GitHub may start it late
  workflow_dispatch:       # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          # Keep this job's output aside, then re-apply it on top of the newest commit.
          # That way a commit from the spreads job can never cause a merge conflict.
          FILES="docs/index.html data/possessions.json data/halves.json"
          mkdir -p /tmp/out
          for f in $FILES; do
            if [ -f "$f" ]; then mkdir -p "/tmp/out/$(dirname $f)"; cp "$f" "/tmp/out/$f"; fi
          done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/out/. .
            for f in $FILES; do if [ -f "$f" ]; then git add "$f"; fi; done
            git diff --staged --quiet && exit 0
            git commit -m "Update briefing"
            git push origin HEAD:main && exit 0
            sleep $((i * 4))
          done
          echo "Could not push after 5 tries"; exit 1
