name: NBA briefing

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch:       # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false   # let a running build finish instead of cancelling it

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/index.html
          if [ -f data/possessions.json ]; then git add data/possessions.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update briefing"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "Could not push after 3 tries"; exit 1
