name: NBA spreads

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: spreads
  cancel-in-progress: false

jobs:
  spreads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py --spreads
      - run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          if [ -f docs/spreads.json ]; then git add docs/spreads.json; fi
          if [ -f data/spread_history.json ]; then git add data/spread_history.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update spreads"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "Could not push after 3 tries"; exit 1
